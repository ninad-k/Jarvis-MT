<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Arc MT</title>
	<link rel="stylesheet" href="launcher.css">
	<script src="launcher.js" defer></script>
</head>
<body>
	<main>
		<div class="orb" aria-hidden="true"></div>
		<h1>Arc MT</h1>
		<p id="status" class="status" role="status" aria-live="polite">Starting...</p>

		<form id="form" novalidate hidden>
			<label for="url">Backend URL</label>
			<input id="url" name="url" type="url" inputmode="url" autocomplete="off" spellcheck="false"
				placeholder="https://127.0.0.1:8787" required>
			<p class="hint">The address where jarvis-api serves the app. Use https. Plain http is accepted for localhost only.</p>
			<button id="connect" type="submit">Connect</button>
		</form>

		<p id="error" class="error" role="alert" hidden></p>
		<p class="hint foot">Certificate errors: create a trusted local certificate with mkcert. See docs/desktop.md.</p>
	</main>
</body>
</html>
