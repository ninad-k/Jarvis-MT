[package]
name = "jarvis-desktop"
version = "0.1.0"
description = "Jarvis MT desktop shell"
authors = ["Ninad K"]
edition = "2024"
rust-version = "1.88"
license = "Apache-2.0"
publish = false

[lib]
name = "jarvis_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "=2.7.4", features = [] }

[dependencies]
tauri = { version = "=2.12.5", features = [] }
tauri-plugin-store = "=2.5.0"
reqwest = { version = "0.13", default-features = false, features = ["rustls"] }
serde_json = "1"
url = "2"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-single-instance = "=2.5.5"
tauri-plugin-window-state = "=2.5.0"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
