[package]
name = "jarvis-api"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
argon2 = "0.6.0"
axum-server = { version = "0.8.0", default-features = false, features = ["tls-rustls-no-provider"] }
base64 = "0.23.1"
chacha20poly1305 = "0.11.0"
clap = { version = "4.6.7", features = ["derive"] }
getrandom = "0.4.3"
hkdf = "0.13.0"
hyper-util = { version = "0.1.21", default-features = false, features = ["http1", "http2", "server-auto", "tokio"] }
jarvis-voice = { version = "0.1.0", path = "../voice" }
jsonwebtoken = { version = "9.3.1", default-features = false }
qrcode = { version = "0.14.1", default-features = false }
rpassword = "7.5.4"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
sha2 = "0.11"
tower = { version = "0.5.3", features = ["util"] }
totp-rs = { version = "6.0.0", features = ["otpauth"] }
tracing-appender = "0.2.5"
anyhow = "1.0.104"
async-trait = "0.1.92"
axum = { version = "0.8.9", features = ["ws"] }
chrono = { version = "0.4.45", features = ["serde"] }
dotenvy = "0.15.7"
jarvis-bridge-client = { version = "0.1.0", path = "../bridge-client" }
jarvis-gate = { version = "0.1.0", path = "../gate" }
jarvis-llm = { version = "0.1.0", path = "../llm" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sqlx = { version = "0.8.6", default-features = false, features = ["sqlite", "runtime-tokio", "migrate", "macros", "chrono"] }
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["full"] }
toml = "1.1.8"
tower-http = { version = "0.7.1", features = ["cors", "trace", "fs", "timeout"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
uuid = { version = "1.26.1", features = ["v4", "serde"] }

[features]
# Local speech-to-text with whisper.cpp. Off by default: it needs CMake and LLVM to build.
whisper = ["jarvis-voice/whisper"]

[target.'cfg(windows)'.dependencies]
windows-service = "0.8.1"

[dev-dependencies]
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
rcgen = "0.14.10"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls-no-provider", "json", "cookies"] }
tokio-tungstenite = { version = "0.30.0", features = ["rustls-tls-native-roots"] }
http-body-util = "0.1.5"
jarvis-bridge-client = { path = "../bridge-client", features = ["mock"] }
