version: 2

updates:
  # Rust workspace (crates/*)
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
      day: monday
    # Wait a week after a release before proposing it, so a compromised or yanked
    # release is usually caught before it reaches a pull request.
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    labels: [dependencies, rust]
    commit-message:
      prefix: "chore(deps)"
    groups:
      cargo-minor-patch:
        update-types: [minor, patch]
    ignore:
      # jsonwebtoken 10+ needs the rust_crypto backend, which pulls in the `rsa` crate
      # (RUSTSEC-2023-0071, no fix). Stay on 9.x until that changes.
      - dependency-name: jsonwebtoken
        update-types: [version-update:semver-major]

  # Tauri desktop shell (own lockfile, excluded from the workspace)
  - package-ecosystem: cargo
    directory: /apps/desktop/src-tauri
    schedule:
      interval: weekly
      day: monday
    # Wait a week after a release before proposing it, so a compromised or yanked
    # release is usually caught before it reaches a pull request.
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    labels: [dependencies, rust, desktop]
    commit-message:
      prefix: "chore(deps)"
    groups:
      desktop-cargo-minor-patch:
        update-types: [minor, patch]

  # Web app
  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: weekly
      day: monday
    # Wait a week after a release before proposing it, so a compromised or yanked
    # release is usually caught before it reaches a pull request.
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    labels: [dependencies, web]
    commit-message:
      prefix: "chore(deps)"
    groups:
      web-minor-patch:
        update-types: [minor, patch]
    ignore:
      # Type definitions track the supported Node line (engines >=22, CI on 24),
      # not the newest Node release.
      - dependency-name: "@types/node"
        update-types: [version-update:semver-major]

  # Desktop front-end tooling (Tauri CLI and API packages)
  - package-ecosystem: npm
    directory: /apps/desktop
    schedule:
      interval: weekly
      day: monday
    # Wait a week after a release before proposing it, so a compromised or yanked
    # release is usually caught before it reaches a pull request.
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    labels: [dependencies, desktop]
    commit-message:
      prefix: "chore(deps)"
    groups:
      desktop-npm-minor-patch:
        update-types: [minor, patch]

  # Workflow actions (pinned by commit SHA; Dependabot updates the SHA and the version comment)
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    # Wait a week after a release before proposing it, so a compromised or yanked
    # release is usually caught before it reaches a pull request.
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    labels: [dependencies, ci]
    commit-message:
      prefix: "chore(ci)"
    groups:
      actions-minor-patch:
        update-types: [minor, patch]
