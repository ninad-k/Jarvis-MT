name: Feature request
description: Suggest an improvement or a new capability.
title: "[Feature]: "
labels: [enhancement, needs-triage]
body:
  - type: markdown
    attributes:
      value: |
        Please read [SPEC.md](https://github.com/ninad-k/Jarvis-MT/blob/main/SPEC.md) first. The safety rules there (the LLM never executes a trade, every trade needs a timed confirmation, demo by default) are not negotiable, so a request that weakens them will be declined.

  - type: textarea
    id: problem
    attributes:
      label: What problem are you trying to solve?
      description: Describe your situation, not the solution.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: What would you like to see?
      description: How you imagine it working. An example phrase or screen is welcome.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you considered
      description: Other ways to solve it, including doing nothing.

  - type: dropdown
    id: component
    attributes:
      label: Area
      options:
        - API
        - MT5 EA
        - Web app
        - Desktop app
        - Voice
        - Action gate and safety
        - LLM providers
        - Docs
        - Other
    validations:
      required: true

  - type: dropdown
    id: safety
    attributes:
      label: Does it touch the safety rules?
      description: Anything that changes what can reach MT5, the confirmation step, the limits, the kill switch or authentication.
      options:
        - "No"
        - "Yes (I explain how in the description above)"
        - Not sure
    validations:
      required: true

  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I searched the existing issues and discussions.
          required: true
        - label: I am willing to help test this, or to send a pull request.
