name: Whisper build

# Builds and tests the optional `whisper` feature (whisper.cpp via whisper-rs). It needs CMake
# and LLVM (libclang), which are slow to set up and sometimes missing on a hosted runner, so
# this is not part of the required CI workflow. It runs weekly, on demand, and when the voice
# crate changes.

on:
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "crates/voice/**"
      - ".github/workflows/whisper.yml"
  pull_request:
    paths:
      - "crates/voice/**"
      - ".github/workflows/whisper.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  whisper:
    name: Whisper feature (windows)
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install the stable toolchain
        shell: bash
        run: rustup toolchain install stable --profile minimal --component clippy --no-self-update

      # The hosted image normally has both. Install only what is missing.
      - name: Make sure CMake and LLVM are available
        shell: pwsh
        run: |
          if (-not (Get-Command cmake -ErrorAction SilentlyContinue)) {
            choco install cmake --installargs 'ADD_CMAKE_TO_PATH=System' -y --no-progress
          }
          $llvm = 'C:\Program Files\LLVM\bin'
          if (-not (Test-Path (Join-Path $llvm 'libclang.dll'))) {
            choco install llvm -y --no-progress
          }
          "LIBCLANG_PATH=$llvm" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          cmake --version

      - name: Cache Cargo
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: Clippy (voice, whisper)
        run: cargo clippy -p jarvis-voice --all-targets --features whisper -- -D warnings

      - name: Test (voice, whisper)
        run: cargo test -p jarvis-voice --features whisper
