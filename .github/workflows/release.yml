name: Release

# Push a tag such as v0.2.0 (or v0.2.0-rc.1 for a pre-release). The workflow builds every
# artifact; the publish job then waits for a reviewer to approve the `release` environment,
# writes SHA256SUMS, attaches a build provenance attestation and creates the GitHub release
# with the notes from CHANGELOG.md. The tag must have a "## [x.y.z]" section there.

on:
  push:
    tags: ["v*"]

# Releases are never cancelled halfway.
concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

# Build jobs only read. The publish job raises its own permissions.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  VERSION: ${{ github.ref_name }}

jobs:
  notes:
    name: Release notes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      prerelease: ${{ steps.extract.outputs.prerelease }}
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Extract the notes for this version from CHANGELOG.md
        id: extract
        run: |
          version="${VERSION#v}"
          section="$version"
          prerelease=false
          if [[ "$version" == *-* ]]; then
            prerelease=true
          fi
          extract() {
            awk -v heading="## [$1]" '
              /^## \[/ { if (found) exit; if (index($0, heading) == 1) { found = 1; next } }
              found { print }
            ' CHANGELOG.md
          }
          extract "$section" > notes.md
          if ! grep -q '[^[:space:]]' notes.md && [ "$prerelease" = true ]; then
            echo "No section for $version; using [Unreleased] for the pre-release."
            extract "Unreleased" > notes.md
          fi
          if ! grep -q '[^[:space:]]' notes.md; then
            echo "::error file=CHANGELOG.md::No release notes found for ## [$version]. Add the section and re-tag."
            exit 1
          fi
          echo "prerelease=$prerelease" >> "$GITHUB_OUTPUT"
          cat notes.md

      - name: Upload the notes
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-notes
          path: notes.md
          if-no-files-found: error

  api:
    name: jarvis-api (${{ matrix.name }})
    runs-on: windows-latest
    timeout-minutes: 60
    # The whisper build needs CMake and LLVM; it must not block the release if it breaks.
    continue-on-error: ${{ matrix.experimental }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: standard
            suffix: ""
            cargo_args: ""
            experimental: false
          - name: whisper
            suffix: "-whisper"
            cargo_args: "--features whisper"
            experimental: true
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The whisper variant is built only once jarvis-api forwards the `whisper` feature.
      - name: Check that this variant exists
        id: variant
        shell: bash
        run: |
          if [ "${{ matrix.name }}" = whisper ] && ! grep -Eq '^whisper[[:space:]]*=' crates/api/Cargo.toml; then
            echo "build=false" >> "$GITHUB_OUTPUT"
            echo "jarvis-api has no 'whisper' feature yet; skipping this variant."
          else
            echo "build=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Install the stable toolchain
        if: steps.variant.outputs.build == 'true'
        shell: bash
        run: rustup toolchain install stable --profile minimal --no-self-update

      # Chocolatey installs are pinned to exact versions so a new upstream release cannot change
      # the build. Bump them on purpose (check https://community.chocolatey.org/packages/cmake
      # and /llvm first).
      - name: Make sure CMake and LLVM are available
        if: steps.variant.outputs.build == 'true' && matrix.name == 'whisper'
        shell: pwsh
        env:
          CMAKE_VERSION: "4.4.4"
          LLVM_VERSION: "23.1.3"
        run: |
          if (-not (Get-Command cmake -ErrorAction SilentlyContinue)) {
            choco install cmake --version $env:CMAKE_VERSION --installargs 'ADD_CMAKE_TO_PATH=System' -y --no-progress
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          $llvm = 'C:\Program Files\LLVM\bin'
          if (-not (Test-Path (Join-Path $llvm 'libclang.dll'))) {
            choco install llvm --version $env:LLVM_VERSION -y --no-progress
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          "LIBCLANG_PATH=$llvm" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Cache Cargo
        if: steps.variant.outputs.build == 'true'
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: release-${{ matrix.name }}

      - name: Build jarvis-api.exe
        if: steps.variant.outputs.build == 'true'
        run: cargo build --release --locked -p jarvis-api ${{ matrix.cargo_args }}

      - name: Package
        if: steps.variant.outputs.build == 'true'
        shell: pwsh
        run: |
          $stage = "stage/jarvis-api"
          New-Item -ItemType Directory -Force -Path $stage, "dist" | Out-Null
          Copy-Item target/release/jarvis-api.exe $stage
          Copy-Item LICENSE, README.md, CHANGELOG.md, .env.example $stage
          Copy-Item config/jarvis.example.toml $stage
          Compress-Archive -Path "$stage/*" -DestinationPath "dist/jarvis-api-$env:VERSION-windows-x64${{ matrix.suffix }}.zip"

      - name: Upload
        if: steps.variant.outputs.build == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist-api-${{ matrix.name }}
          path: dist/*
          if-no-files-found: error

  web:
    name: Web build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pnpm
        run: npm install --global pnpm@11.24.0

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Build
        working-directory: web
        run: |
          pnpm install --frozen-lockfile
          pnpm run build

      - name: Package
        run: |
          mkdir -p dist
          (cd web/build && zip -r -X "$GITHUB_WORKSPACE/dist/jarvis-web-${VERSION}.zip" .)

      - name: Upload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist-web
          path: dist/*
          if-no-files-found: error

  ea:
    name: MT5 EA sources
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # .gitattributes checks the .mq5 and .mqh files out with CRLF, as MetaEditor expects.
      # The EA itself is compiled on a Windows PC with MetaTrader (scripts/compile-ea.ps1).
      - name: Package
        run: |
          mkdir -p dist
          zip -r -X "dist/jarvis-mt5-ea-${VERSION}.zip" mql5 scripts/install-ea.ps1 scripts/compile-ea.ps1 LICENSE

      - name: Upload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist-ea
          path: dist/*
          if-no-files-found: error

  desktop:
    name: Desktop installer (Tauri)
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Detect the desktop app
        id: detect
        shell: bash
        run: |
          if [ -f apps/desktop/src-tauri/tauri.conf.json ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::warning::apps/desktop/src-tauri/tauri.conf.json not found; this release has no desktop installer."
          fi

      - name: Install the stable toolchain
        if: steps.detect.outputs.present == 'true'
        shell: bash
        run: rustup toolchain install stable --profile minimal --no-self-update

      - name: Cache Cargo
        if: steps.detect.outputs.present == 'true'
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: apps/desktop/src-tauri
          key: release

      - name: Install pnpm
        if: steps.detect.outputs.present == 'true'
        run: npm install --global pnpm@11.24.0

      - name: Set up Node.js
        if: steps.detect.outputs.present == 'true'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      # The installer is not code-signed yet, so Windows SmartScreen will warn on first run.
      - name: Build the installer
        if: steps.detect.outputs.present == 'true'
        shell: bash
        run: |
          pnpm --dir apps/desktop install --frozen-lockfile
          pnpm --dir apps/desktop exec tauri build

      - name: Collect the installers
        if: steps.detect.outputs.present == 'true'
        shell: bash
        run: |
          mkdir -p dist
          bundle=apps/desktop/src-tauri/target/release/bundle
          found=0
          for f in "$bundle"/nsis/*.exe "$bundle"/msi/*.msi; do
            if [ -f "$f" ]; then
              cp "$f" dist/
              found=1
            fi
          done
          if [ "$found" = 0 ]; then
            echo "::error::tauri build produced no installer under $bundle"
            exit 1
          fi

      - name: Upload
        if: steps.detect.outputs.present == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist-desktop
          path: dist/*
          if-no-files-found: error

  publish:
    name: Publish release
    needs: [notes, api, web, ea, desktop]
    runs-on: ubuntu-latest
    # Waits for approval: the `release` environment (Settings > Environments) must have a
    # required reviewer, so pushing a tag alone cannot publish.
    environment: release
    timeout-minutes: 15
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Download the build artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: dist-*
          path: dist
          merge-multiple: true

      - name: Download the release notes
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-notes
          path: notes

      - name: Write SHA256SUMS
        working-directory: dist
        run: |
          ls -l
          sha256sum -- * > ../SHA256SUMS
          mv ../SHA256SUMS SHA256SUMS
          cat SHA256SUMS

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*

      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          PRERELEASE: ${{ needs.notes.outputs.prerelease }}
        run: |
          flags=()
          if [ "$PRERELEASE" = true ]; then
            flags+=(--prerelease)
          fi
          gh release create "$VERSION" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "Jarvis MT $VERSION" \
            --notes-file notes/notes.md \
            "${flags[@]}"
