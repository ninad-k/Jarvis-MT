[workspace]
resolver = "3"
members = ["crates/api", "crates/bridge-client", "crates/gate", "crates/llm", "crates/voice"]
# The Tauri shell has its own lockfile and heavy dependencies.
exclude = ["apps/desktop/src-tauri"]

[workspace.package]
edition = "2024"
rust-version = "1.88"
license = "Apache-2.0"
publish = false
