<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
		<meta name="theme-color" content="#04070d" />
		<meta name="color-scheme" content="dark" />
		<title>Offline · Jarvis MT</title>
		<style>
			html, body { height: 100%; margin: 0; background: #04070d; color: #dbe8f4; font: 14px/1.45 system-ui, 'Segoe UI', sans-serif; }
			main { min-height: 100%; display: grid; place-content: center; justify-items: center; gap: 14px; padding: 24px; text-align: center; }
			.orb { width: 84px; height: 84px; border-radius: 50%; background: radial-gradient(circle at 38% 34%, #c9f8ff 0%, #22d3ee 30%, #0a3f86 68%, #04070d 72%); box-shadow: 0 0 60px 14px rgb(34 211 238 / 0.25); opacity: 0.55; }
			h1 { margin: 0; font-size: 18px; font-weight: 600; }
			p { margin: 0; max-width: 32ch; color: #8aa0b6; }
			button { height: 40px; padding: 0 22px; border: 1px solid #22d3ee; background: rgb(34 211 238 / 0.15); color: #22d3ee; font: inherit; letter-spacing: 0.12em; text-transform: uppercase; cursor: pointer; }
			button:focus-visible { outline: 2px solid #22d3ee; outline-offset: 2px; }
		</style>
	</head>
	<body>
		<main>
			<div class="orb" aria-hidden="true"></div>
			<h1>Offline — Jarvis needs the backend</h1>
			<p>Prices, positions and trading all come from your Jarvis server. Check your connection, then try again.</p>
			<button type="button" onclick="location.href = '/'">Try again</button>
		</main>
	</body>
</html>
