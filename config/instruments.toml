# Canonical instruments. Arc MT speaks in these names everywhere (limits, watchlist,
# chat, the gate); each broker's own names are mapped to them per broker (see
# config/broker_symbols.toml and docs/symbol-mapping.md).
#
#   canonical  the one name used inside Arc MT (upper case)
#   class      fx | metal | index | energy | crypto | other
#   aliases    generic names that mean the same instrument (upper case). A broker symbol
#              built from an alias core ("NAS100.cash", "USTEC") is recognised too.
#   keywords   lower-case phrases that identify it in a broker's symbol description
#
# Spoken words ("gold", "sona", "nasdaq") are set in [symbols.aliases] in
# config/jarvis.toml and point at these canonical names.

# ---- Metals ----------------------------------------------------------------
[[instrument]]
canonical = "XAUUSD"
class = "metal"
aliases = ["GOLD", "XAU"]
keywords = ["gold", "xau/usd"]

[[instrument]]
canonical = "XAGUSD"
class = "metal"
aliases = ["SILVER", "XAG"]
keywords = ["silver", "xag/usd"]

[[instrument]]
canonical = "XPTUSD"
class = "metal"
aliases = ["PLATINUM"]
keywords = ["platinum"]

[[instrument]]
canonical = "XPDUSD"
class = "metal"
aliases = ["PALLADIUM"]
keywords = ["palladium"]

